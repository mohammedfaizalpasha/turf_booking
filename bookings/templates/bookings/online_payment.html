<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Payment | TurfBook</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .payment-card {
            background: white;
            width: 400px;
            max-width: 90%;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            color: #198754;
        }

        .amount {
            font-size: 32px;
            font-weight: bold;
            margin: 20px 0;
        }

        .pay-button {
            width: 100%;
            padding: 15px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .pay-button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="payment-card">

    <h1>Complete Your Payment</h1>

    <p><strong>Turf:</strong> {{ booking.turf.name }}</p>
    <p><strong>Date:</strong> {{ booking.date }}</p>
    <p><strong>Time:</strong> {{ booking.start_time }}</p>

    <div class="amount">
        ₹{{ booking.total_price }}
    </div>

    <button id="pay-button" class="pay-button">
        Pay Online
    </button>

</div>

<script>

document.getElementById("pay-button").onclick = function () {

    var options = {
        "key": "{{ razorpay_key_id }}",
        "amount": "{{ amount }}",
        "currency": "INR",
        "name": "TurfBook",
        "description": "Turf Booking Payment",
        "order_id": "{{ razorpay_order_id }}",

        "handler": function (response) {

            alert("Payment Successful!");

            // Payment verification will be added next
            console.log(response);
        },

        "theme": {
            "color": "#198754"
        }
    };

    var rzp = new Razorpay(options);

    rzp.open();
};

</script>

</body>
</html>
