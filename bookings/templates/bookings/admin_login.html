```
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | TurfBook</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #022c22, #065f46, #15803d);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .login-container {
        width: 100%;
        max-width: 440px;
        background: rgba(255, 255, 255, 0.98);
        padding: 40px;
        border-radius: 24px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    }

    .logo-circle {
        width: 75px;
        height: 75px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: linear-gradient(135deg, #15803d, #22c55e);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 35px;
        box-shadow: 0 10px 25px rgba(21, 128, 61, 0.3);
    }

    .logo {
        text-align: center;
        font-size: 30px;
        font-weight: bold;
        color: #064e3b;
        margin-bottom: 8px;
    }

    h1 {
        text-align: center;
        font-size: 22px;
        color: #1f2937;
        margin: 15px 0 8px;
    }

    .subtitle {
        text-align: center;
        color: #6b7280;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    .message {
        background: #fee2e2;
        color: #b91c1c;
        padding: 13px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 14px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #374151;
        font-weight: bold;
        font-size: 14px;
    }

    .input-wrapper {
        position: relative;
    }

    .input-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
    }

    input {
        width: 100%;
        padding: 15px 15px 15px 48px;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        font-size: 15px;
        transition: 0.3s;
    }

    input:focus {
        outline: none;
        border-color: #16a34a;
        box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.12);
    }

    .login-button {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #15803d, #16a34a);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 5px;
    }

    .login-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(21, 128, 61, 0.3);
    }

    .footer-link {
        text-align: center;
        margin-top: 28px;
    }

    .footer-link a {
        color: #15803d;
        text-decoration: none;
        font-weight: bold;
    }

    .footer-link a:hover {
        text-decoration: underline;
    }

    .security-text {
        text-align: center;
        color: #9ca3af;
        font-size: 12px;
        margin-top: 22px;
    }

    @media (max-width: 480px) {

        .login-container {
            padding: 30px 22px;
        }

        .logo {
            font-size: 26px;
        }

    }

</style>
```

</head>

<body>

```
<div class="login-container">

    <div class="logo-circle">
        🏏
    </div>

    <div class="logo">
        TurfBook
    </div>

    <h1>Admin Portal</h1>

    <p class="subtitle">
        Sign in securely to manage bookings and payments.
    </p>


    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <div class="input-group">

            <label for="username">
                Username
            </label>

            <div class="input-wrapper">

                <span class="input-icon">
                    👤
                </span>

                <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autofocus
                >

            </div>

        </div>


        <div class="input-group">

            <label for="password">
                Password
            </label>

            <div class="input-wrapper">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

        </div>


        <button
            type="submit"
            class="login-button"
        >
            🔐 Login to Dashboard
        </button>

    </form>


    <div class="footer-link">

        <a href="{% url 'home' %}">
            ← Back to TurfBook
        </a>

    </div>


    <div class="security-text">
        🔐 Secure Admin Access
    </div>

</div>
```

</body>

</html>
